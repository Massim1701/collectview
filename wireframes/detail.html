<body class="page-shell">

<div class="app-frame">

    <div style="position:relative;">
      <div style="width:100%;height:290px;background:linear-gradient(150deg,#2B2E45,#6672BD);"></div>
      <a href="./scan-results.html" style="position:absolute;top:28px;left:24px;width:40px;height:40px;border-radius:999px;background:rgba(23,21,18,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;">

        <div class="link-chip">

      <div class="track-row"><span>3. Come As You Are</span><span class="dur">3:39</span></div>
      <div class="track-row"><span>4. Breed</span><span class="dur">3:03</span></div>

      <div style="text-align:center;font-size:12.5px;color:var(--text-faint);margin-top:22px;">1.234 Sammler haben diesen Tonträger</div>
