<script>
  /* Stubs statt auth.js/db.js/wishlist.js. Die Tabellen liefern, was
     `rows` für sie hergibt; `inserts` sammelt, was geschrieben wurde. */
  var rows = { collection_items: [], wishlist_items: [], scan_events: [], releases: [] };
  var rpcAufrufe = [];
  var inserts = [];        // alles außer scan_events
  var scanInserts = [];    // die gezählten Scans
  var wishlistAdds = [];
  var wishlistRemoves = [];
  var insertError = null;
  var wishlistError = null;
  var fetchResponse = null;
  var fetchCalls = 0;
  var scanLimitReached = false;   // simuliert den Trigger aus db/scan-limit.sql
  var scanTabelleFehlt = false;   // simuliert: db/scan-limit.sql nie ausgeführt
  var subscribed = false;
  // discogs.js braucht beides beim Laden; die Werte sind reine Attrappen.
  var SUPABASE_URL = "https://test.supabase.co";
  var SUPABASE_ANON_KEY = "test-anon-key";
  var sessionStub = null;    // null = keine Sitzung, also Direktweg
  var proxyAntwort = null;   // gesetzt: eigene Antwort für die Edge Function

  var sb = {
    from(table) {
      return {
        select() {
          const filter = async (column, value) => {
            if (scanTabelleFehlt && table === "scan_events") {
              return { data: null, count: null, error: { code: "PGRST205", message: "Could not find the table 'public.scan_events' in the schema cache" } };
            }
            if (wishlistError && table === "wishlist_items") return { data: null, error: wishlistError };
            const list = rows[table] || [];
            const wanted = Array.isArray(value) ? value.map(String) : [String(value)];
            const data = list.filter((r) => wanted.includes(String(r[column])));
            return { data, count: data.length, error: null };
          };
          return { eq: filter, in: filter };
        },
        async insert(row) {
          if (table === "scan_events") {
            if (scanTabelleFehlt) {
              return { error: { code: "PGRST205", message: "Could not find the table 'public.scan_events' in the schema cache" } };
            }
            if (scanLimitReached) {
              return { error: { message: "SCAN_LIMIT: keine freien Scans mehr", code: "23514" } };
            }
            scanInserts.push(row);
            rows.scan_events.push(row);
            return { error: null };
          }
          inserts.push({ table, row });
          return { error: insertError };
        },
      };
    },
  };

  async function fetchIsSubscribed() { return subscribed; }

  sb.auth = { getSession: async () => ({ data: { session: sessionStub } }) };

  sb.rpc = async (name, args) => {
    rpcAufrufe.push({ name, args });
    return { data: "release-" + (args?.daten?.discogs_id ?? "x"), error: null };
  };

  var currentUser = { id: "user-1" };
  async function requireAuth() { return currentUser; }
  function renderAccountRow() {}
  async function fetchCollection() { return []; }
  async function addWishlistItem(fields) {
    if (wishlistError) throw new Error(wishlistError.message);
    wishlistAdds.push(fields);
    return { id: "wl-neu", ...fields };
  }
  async function removeWishlistItem(id) { wishlistRemoves.push(id); }

  var gesuchtePfade = [];
  window.fetch = async (url) => {
    fetchCalls += 1; gesuchtePfade.push(String(url));
    if (proxyAntwort && String(url).includes("discogs-suche")) return proxyAntwort;
    return fetchResponse;
  };

  /* ZXing-Ersatz: merkt sich nur, mit welcher Kamera-ID gestartet wurde. */
  var zxingAufrufe = [];
  var ZXingBrowser = {
    // scanner.js baut daraus die Formatvorgabe; Zahlen genügen hier.
    BarcodeFormat: { EAN_13: 8, EAN_8: 7, UPC_A: 14, UPC_E: 15 },
    // Nur 1D: der Scanner nutzt seit dem Wechsel den schmalen Leser.
    BrowserMultiFormatOneDReader: function () {
      this.decodeFromConstraints = async (constraints) => {
        zxingAufrufe.push(constraints);
        return { stop() {} };
      };
    },
    BrowserCodeReader: {
      listVideoInputDevices: async () => [
        { deviceId: "front", label: "Front" },
        { deviceId: "ultraweit", label: "Ultraweitwinkel" },
        { deviceId: "tele", label: "Tele" },
      ],
    },
  };
  navigator.mediaDevices = navigator.mediaDevices || {};
  navigator.mediaDevices.enumerateDevices = async () => [
    { kind: "videoinput", deviceId: "front", label: "Front" },
    { kind: "videoinput", deviceId: "tele", label: "Tele" },
  ];

  function resetStub() {
    rows = { collection_items: [], wishlist_items: [], scan_events: [], releases: [] };
    inserts = []; scanInserts = []; wishlistAdds = []; wishlistRemoves = []; rpcAufrufe = [];
    insertError = null; wishlistError = null; fetchResponse = null;
    fetchCalls = 0; gesuchtePfade = []; scanLimitReached = false; scanTabelleFehlt = false; subscribed = false;
    scanQuota = { used: 0, subscribed: false, known: false };
    sessionStub = null; proxyAntwort = null;
    // Merker in discogs.js: sonst schleppt ein Test das "Proxy ist tot"
    // des vorigen mit sich herum.
    proxyAus = false; proxyBenutzt = false;
  }

  /** Discogs-Antwort mit n Treffern nachbauen. */
  function discogsAnswer(results) {
    return { ok: true, status: 200, json: async () => ({ results }) };
  }
  /* Ein Discogs-Suchtreffer. barcode ist Pflicht, seit der Scanner
     gegenprüft – Discogs liefert das Feld ebenfalls mit. */
  function discogsResult(id, title, extra = {}) {
    return {
      id, title, format: ["Vinyl", "LP"], year: "1991", country: "US",
      cover_image: null, barcode: ["111"], ...extra,
    };
  }
  /* Ein Zufallstreffer der unscharfen Discogs-Suche: passt nicht zum Code. */
  function fremderTreffer(id, title) {
    return discogsResult(id, title, { barcode: ["4006758290430"] });
  }
</script>

<script>
const out = () => document.getElementById("results");
const head = () => document.getElementById("results-title").textContent;
const card = () => document.getElementById("results-card");
const btn = (action) => out().querySelector(`[data-action="${action}"]`);

/* ---------- scanStatusFor: reine Logik ---------- */

test("Gleiche discogs_id gilt als in der Sammlung", () => {
  const s = scanStatusFor({ discogs_id: 42, barcode: "111" },
    { collection: [{ id: "c1", discogs_id: 42, quantity: 2 }], wishlist: [] });
  assert(s.inCollection, "Treffer nicht erkannt");
  assertEqual(s.inCollection.id, "c1");
});

test("Gleicher Barcode zählt auch ohne discogs_id", () => {
  const s = scanStatusFor({ discogs_id: 42, barcode: "111" },
    { collection: [{ id: "c2", discogs_id: null, barcode: "111" }], wishlist: [] });
  assert(s.inCollection, "Barcode-Treffer nicht erkannt");
  assertEqual(s.inCollection.id, "c2");
});

test("Verschiedene IDs und Barcodes ergeben keinen Treffer", () => {
  const s = scanStatusFor({ discogs_id: 42, barcode: "111" },
    { collection: [{ id: "c3", discogs_id: 43, barcode: "222" }], wishlist: [] });
  assertEqual(s.inCollection, null);
  assertEqual(s.onWishlist, null);
});

test("null trifft nicht auf null", () => {
  const s = scanStatusFor({ discogs_id: null, barcode: null },
    { collection: [{ id: "c4", discogs_id: null, barcode: null }], wishlist: [] });
  assertEqual(s.inCollection, null, "zwei Leerwerte dürfen kein Treffer sein");
});

test("Wunschliste wird über die discogs_id erkannt", () => {
  const s = scanStatusFor({ discogs_id: 7 },
    { collection: [], wishlist: [{ id: "w1", discogs_id: 7 }] });
  assert(s.onWishlist, "Wunschlisten-Treffer nicht erkannt");
});

/* ---------- Hinweis ---------- */

test("Hinweis nennt die Menge und verlinkt den Eintrag", () => {
  const html = scanStatusMarkup({ inCollection: { id: "abc", quantity: 3 }, onWishlist: null });
  assertIncludes(html, "Hast du schon (Menge: 3)");
  assertIncludes(html, "detail.html?id=abc");
});

test("Fehlende Menge gilt im Hinweis als 1", () => {
  assertIncludes(scanStatusMarkup({ inCollection: { id: "abc" } }), "Menge: 1");
});

test("Wunschlisten-Hinweis bietet das Verschieben an", () => {
  const html = scanStatusMarkup({ inCollection: null, onWishlist: { id: "w1" } });
  assertIncludes(html, "Auf deiner Wunschliste");
  assertIncludes(html, "wishlist-to-collection");
});

test("Neuer Tonträger bekommt keinen Hinweiskasten", () => {
  assertEqual(scanStatusMarkup({ inCollection: null, onWishlist: null }), "");
});

/* ---------- Fehlende Spalte darf den Scan nicht kippen ---------- */

test("Fehlende discogs_id-Spalte in wishlist_items wird geschluckt", async () => {
  resetStub();
  wishlistError = { code: "42703", message: 'column "discogs_id" does not exist' };
  assertEqual(await fetchWishlistByDiscogsIds([1, 2]), [], "42703 muss leer zurückkommen");
});

test("Ohne IDs wird gar nicht erst gefragt", async () => {
  resetStub();
  assertEqual(await fetchCollectionByDiscogsIds([]), []);
  assertEqual(await fetchCollectionByBarcode(null), []);
});

/* ---------- Schritt 2: Verzweigung nach Trefferzahl ---------- */

test("Ein Treffer geht direkt aufs Ergebnis", async () => {
  resetStub();
  fetchResponse = discogsAnswer([discogsResult(1, "Nirvana - Nevermind")]);
  await lookupBarcode("111");

  assertEqual(head(), "Treffer");
  assertIncludes(out().textContent, "Nevermind");
  assert(btn("add-collection"), "Aktion 'Zur Sammlung' fehlt");
  assert(!out().querySelector(".result-card"), "es darf keine Auswahlliste geben");
});

test("Mehrere Treffer zeigen die Auswahl", async () => {
  resetStub();
  fetchResponse = discogsAnswer([
    discogsResult(1, "Nirvana - Nevermind"),
    discogsResult(2, "Nirvana - Nevermind", { year: "2008" }),
  ]);
  await lookupBarcode("111");

  assertEqual(head(), "2 Treffer gefunden");
  assertEqual(out().querySelectorAll(".result-card").length, 2);
  assert(btn("manual-open"), "'Manuell anlegen' fehlt in der Auswahl");
});

test("Aus der Auswahl führt ein Klick zum Ergebnis und zurück", async () => {
  resetStub();
  fetchResponse = discogsAnswer([
    discogsResult(1, "Nirvana - Nevermind"),
    discogsResult(2, "Pixies - Doolittle"),
  ]);
  await lookupBarcode("111");

  out().querySelectorAll(".result-card")[1].click();
  assertEqual(head(), "Treffer");
  assertIncludes(out().textContent, "Doolittle");

  btn("back-to-list").click();
  assertEqual(head(), "2 Treffer gefunden");
});

test("Kein Treffer bietet das manuelle Anlegen an", async () => {
  resetStub();
  fetchResponse = discogsAnswer([]);
  await lookupBarcode("999");

  assertEqual(head(), "Keine Treffer");
  assertIncludes(out().textContent, "Nicht gefunden");
  assert(btn("manual-open"), "'Manuell anlegen' fehlt");
});

/* ---------- Schritt 3 im Ablauf ---------- */

test("Bereits vorhandener Tonträger wird am Ergebnis gemeldet", async () => {
  resetStub();
  rows.collection_items = [{ id: "c9", discogs_id: 1, quantity: 2, barcode: "111", title: "Nevermind" }];
  fetchResponse = discogsAnswer([discogsResult(1, "Nirvana - Nevermind")]);
  await lookupBarcode("111");

  assertIncludes(out().textContent, "Hast du schon (Menge: 2)");
  assert(btn("add-collection").disabled, "'Zur Sammlung' müsste gesperrt sein");
});

test("Vorhandene Ausgabe ist schon in der Auswahlliste markiert", async () => {
  resetStub();
  rows.collection_items = [{ id: "c9", discogs_id: 2, quantity: 1, barcode: null }];
  fetchResponse = discogsAnswer([
    discogsResult(1, "Nirvana - Nevermind"),
    discogsResult(2, "Nirvana - Nevermind", { year: "2008" }),
  ]);
  await lookupBarcode("111");

  const chips = out().querySelectorAll(".scan-chip");
  assertEqual(chips.length, 1, "genau eine Markierung erwartet");
  assertIncludes(chips[0].textContent, "In der Sammlung");
});

test("Wunschlisten-Treffer erscheint am Ergebnis", async () => {
  resetStub();
  rows.wishlist_items = [{ id: "w1", discogs_id: 1, title: "Nevermind" }];
  fetchResponse = discogsAnswer([discogsResult(1, "Nirvana - Nevermind")]);
  await lookupBarcode("111");

  assertIncludes(out().textContent, "Auf deiner Wunschliste");
});

/* ---------- Schritt 4: Aktionen ---------- */

test("'Zur Sammlung' schreibt die Felder aus dem Treffer", async () => {
  resetStub();
  fetchResponse = discogsAnswer([discogsResult(1, "Nirvana - Nevermind")]);
  await lookupBarcode("111");
  btn("add-collection").click();
  await tick();

  assertEqual(inserts.length, 1);
  assertEqual(inserts[0].table, "collection_items");
  assertEqual(inserts[0].row.title, "Nevermind");
  assertEqual(inserts[0].row.artist, "Nirvana");
  assertEqual(inserts[0].row.discogs_id, 1);
  assertEqual(inserts[0].row.barcode, "111");
  assertEqual(inserts[0].row.year, 1991, "Jahr muss eine Zahl sein");
  assertEqual(card().style.display, "none", "Karte müsste nach dem Speichern zu sein");
});

test("'Auf Wunschliste' legt einen Wunschlisten-Eintrag an", async () => {
  resetStub();
  fetchResponse = discogsAnswer([discogsResult(1, "Nirvana - Nevermind")]);
  await lookupBarcode("111");
  btn("add-wishlist").click();
  await tick();

  assertEqual(inserts.length, 0, "die Sammlung darf unberührt bleiben");
  assertEqual(wishlistAdds.length, 1);
  assertEqual(wishlistAdds[0].title, "Nevermind");
});

test("Wunschlisten-Eintrag aus dem Scan trägt discogs_id, Cover und Barcode", async () => {
  resetStub();
  fetchResponse = discogsAnswer([
    discogsResult(1, "Nirvana - Nevermind", { cover_image: "https://example.test/cover.jpg" }),
  ]);
  await lookupBarcode("111");
  btn("add-wishlist").click();
  await tick();

  const row = wishlistAdds[0];
  assertEqual(row.discogs_id, 1, "ohne discogs_id findet der nächste Scan den Eintrag nie");
  assertEqual(row.barcode, "111");
  assertEqual(row.cover_url, "https://example.test/cover.jpg");
  assertEqual(row.artist, "Nirvana");
});

test("Ein gemerkter Tonträger wird beim nächsten Scan wiedererkannt", async () => {
  resetStub();
  fetchResponse = discogsAnswer([discogsResult(1, "Nirvana - Nevermind")]);
  await lookupBarcode("111");
  btn("add-wishlist").click();
  await tick();

  // Genau das, was der Eintrag oben in die Tabelle geschrieben hat.
  rows.wishlist_items = [{ id: "w1", ...wishlistAdds[0] }];
  fetchResponse = discogsAnswer([discogsResult(1, "Nirvana - Nevermind")]);
  await lookupBarcode("111");

  assertIncludes(out().textContent, "Auf deiner Wunschliste");
  assert(btn("wishlist-to-collection"), "Verschieben müsste angeboten werden");
});

test("'Weiter scannen' schließt die Karte, ohne zu speichern, und macht die Kamera wieder an", async () => {
  resetStub();
  if (scanning) stopScan();
  fetchResponse = discogsAnswer([discogsResult(1, "Nirvana - Nevermind")]);
  await lookupBarcode("111");
  zxingAufrufe = [];

  btn("weiter").click();
  await tick();

  assertEqual(inserts.length, 0, "nichts gespeichert");
  assertEqual(wishlistAdds.length, 0);
  assertEqual(card().style.display, "none");
  assertEqual(zxingAufrufe.length, 1, "die Kamera müsste wieder laufen");
  stopScan();
});

test("Nach dem Speichern geht es direkt weiter", async () => {
  resetStub();
  if (scanning) stopScan();
  fetchResponse = discogsAnswer([discogsResult(1, "Nirvana - Nevermind")]);
  await lookupBarcode("111");
  zxingAufrufe = [];

  btn("add-collection").click();
  await tick();

  assertEqual(inserts.length, 1, "gespeichert");
  assertEqual(card().style.display, "none");
  assertEqual(zxingAufrufe.length, 1,
    "wer ein Regal erfasst, scannt die nächste Platte, nicht den Startknopf");
  stopScan();
});

test("Fehlt die scan_events-Tabelle, läuft der Scan trotzdem", async () => {
  resetStub();
  if (scanning) stopScan();
  scanTabelleFehlt = true;
  fetchResponse = discogsAnswer([discogsResult(1, "Nirvana - Nevermind")]);

  await lookupBarcode("111");

  assertEqual(fetchCalls, 1,
    "ein nicht eingerichteter Zähler ist ein Betriebsfehler – er darf die App nicht blockieren");
  assertIncludes(out().textContent, "Nevermind");
  assertEqual(quota(), "", "eine Zahl, die es nicht gibt, wird auch nicht angezeigt");
});

test("Eine fehlende Tabelle ist kein erreichtes Limit", async () => {
  resetStub();
  scanTabelleFehlt = true;
  const r = await recordScan("user-1", "barcode", "111");
  assert(r.ok, "muss durchgelassen werden");
  assert(r.ungezaehlt, "aber als ungezählt gemeldet");
  assert(!r.limitReached, "und keinesfalls als Limit");
});

test("Ohne Tabelle gibt es keinen Zählerstand", async () => {
  resetStub();
  scanTabelleFehlt = true;
  assertEqual(await fetchScanCount("user-1"), null, "null heißt unbekannt, nicht null Scans");
});

/* ---------- Kameraliste ---------- */

const kam = (id, label) => ({ kind: "videoinput", deviceId: id, label });

test("Frontkamera und Exoten fliegen aus der Liste", () => {
  const gefiltert = nurRueckkameras([
    kam("f", "Front Camera"),
    kam("t", "Back Telephoto Camera"),
    kam("d", "Back Dual Wide Camera"),
    kam("u", "Back Ultra Wide Camera"),
  ]);
  assert(!gefiltert.some((d) => d.deviceId === "f"), "wer die Frontkamera wählt, filmt sich selbst");
  assertEqual(gefiltert[0].deviceId, "d", "Dual Wide zuerst – die hat in der Praxis funktioniert");
});

test("Ohne Bezeichnungen bleibt die Liste unangetastet", () => {
  // Vor der ersten Freigabe liefert iOS keine Namen.
  const ohne = [kam("a", ""), kam("b", "")];
  assertEqual(nurRueckkameras(ohne).length, 2, "sonst wäre die Liste leer");
});

test("Gibt es keine Rückkamera, bleibt wenigstens etwas übrig", () => {
  const nurFront = [kam("f", "Front Camera")];
  assertEqual(nurRueckkameras(nurFront).length, 1, "lieber die Frontkamera als gar keine");
});

test("Die gewählte Kamera wird gemerkt und wiederverwendet", () => {
  merkeKamera("d");
  assertEqual(gemerkteKamera(), "d");
  document.getElementById("camera-select").innerHTML = "";
  assertEqual(videoConstraints().deviceId, { exact: "d" },
    "eine feste Kamera ist stabiler als facingMode");
  merkeKamera("");
});

/* ---------- Lesungen absichern ---------- */

test("Eine einzelne Lesung wird noch nicht angenommen", () => {
  letzteLesung = null;
  assertEqual(pruefeLesung("724385522925"), null, "erst bestätigen lassen");
});

test("Zweimal derselbe Code wird angenommen", () => {
  letzteLesung = null;
  pruefeLesung("724385522925");
  assertEqual(pruefeLesung("724385522925"), "724385522925");
});

test("Zwei verschiedene Lesungen bestätigen sich nicht", () => {
  letzteLesung = null;
  pruefeLesung("724385522925");
  assertEqual(pruefeLesung("4601294548122"), null, "der zweite ersetzt nur den Kandidaten");
});

test("Eine falsche Prüfziffer wird sofort verworfen", () => {
  letzteLesung = null;
  assertEqual(pruefeLesung("724385522926"), null);
  assertEqual(letzteLesung, null, "gar nicht erst als Kandidat merken");
});

test("Der echte Fehlgriff vom Gerät käme nicht mehr durch", () => {
  // 4601294548122 hatte eine gültige Prüfziffer und war trotzdem falsch.
  // Einmal gelesen reicht seitdem nicht mehr.
  letzteLesung = null;
  assertEqual(pruefeLesung("4601294548122"), null);
  assertEqual(pruefeLesung("724385522925"), null, "ein anderer Code setzt nur neu an");
});

/* ---------- Barcode von Hand ---------- */

const codeFehler = () => document.getElementById("code-error").textContent;
function tippe(text) {
  document.getElementById("code-input").value = text;
  document.getElementById("code-form").dispatchEvent(new Event("submit", { cancelable: true }));
}

test("Die Prüfziffer wird richtig gerechnet", () => {
  assert(eanPruefzifferStimmt("724385522925"), "OK Computer, UPC-A");
  assert(eanPruefzifferStimmt("0724385522925"), "derselbe Code als EAN-13");
  assert(eanPruefzifferStimmt("4006381333931"), "bekannter EAN-13");
  assert(!eanPruefzifferStimmt("724385522926"), "letzte Ziffer verdreht");
  assert(!eanPruefzifferStimmt("12345"), "falsche Länge");
});

test("Falsche Längen werden abgewiesen", () => {
  assertEqual(pruefeEingabe("").fehler !== undefined, true);
  assertIncludes(pruefeEingabe("12345").fehler, "8, 12 oder 13");
  assertEqual(pruefeEingabe("724385522925").code, "724385522925");
});

test("Zwischenräume und Bindestriche stören nicht", () => {
  assertEqual(pruefeEingabe("7 24385 52292 5").code, "724385522925",
    "unter dem Strichcode stehen die Ziffern in Gruppen");

/**
 * Wirklich unsichtbar – nicht nur mit gesetztem Attribut.
 *
 * el.hidden === true genügt nicht: .btn-secondary setzt
 * display:inline-flex und schlug [hidden], der Knopf stand dauerhaft da
 * (0860b89). Die alten Tests hier prüften nur das Attribut und haben
 * genau das durchgelassen.
 */
function istUnsichtbar(el) {
  return el.hidden && getComputedStyle(el).display === "none";
}

/* ---------- Licht ----------
   Die Attrappe muss srcObject per defineProperty setzen: das echte
   <video> nimmt dort nur eine MediaStream-Instanz an. */
function kameraMitLicht(hatLicht, { schaltenScheitert = false } = {}) {
  const angewandt = [];
  const track = {
    label: "Back Dual Wide Camera",
    getSettings: () => ({ width: 1280, height: 720 }),
    getCapabilities: () => (hatLicht ? { torch: true } : {}),
    applyConstraints: async (c) => {
      if (schaltenScheitert) throw new Error("nicht unterstützt");
      angewandt.push(c);
    },
    addEventListener() {}, stop() {},
  };
  Object.defineProperty(document.getElementById("video"), "srcObject", {
    value: { getVideoTracks: () => [track] }, writable: true, configurable: true,
  });
  return angewandt;
}

test("Ohne gemeldetes Licht bleibt der Knopf verborgen", async () => {
  resetStub();
  const angewandt = kameraMitLicht(false);

  lichtAnbieten();

  assert(istUnsichtbar(document.getElementById("torch-btn")),
    "kein gemeldetes Licht, kein Knopf – und zwar auch tatsächlich unsichtbar");
  await toggleLicht();
  assertEqual(angewandt.length, 0,
    "applyConstraints darf den laufenden Strom nicht anfassen – genau das hat auf iOS die Kamera beendet");
});

/* ---------- Bildserie ---------- */

/** Fläche mit wählbarem Anteil ausgebrannter Pixel und etwas Struktur. */
function testflaeche(hellAnteil) {
  const c = document.createElement("canvas");
  c.width = 60; c.height = 60;
  const x = c.getContext("2d");
  // Struktur: abwechselnd dunkle und mittlere Streifen.
  for (let y = 0; y < 60; y++) {
    x.fillStyle = y % 2 ? "#202020" : "#909090";
    x.fillRect(0, y, 60, 1);
  }
  // Ausgebrannte Fläche von oben.
  x.fillStyle = "#ffffff";
  x.fillRect(0, 0, 60, Math.round(60 * hellAnteil));
  return c;
}

test("Ein Bild mit weniger ausgebrannter Fläche wird besser bewertet", async () => {
  const wenig = bewerteBild(testflaeche(0.05));
  const viel  = bewerteBild(testflaeche(0.60));
  assert(wenig > viel,
    `weniger Glanz muss besser punkten – ${wenig.toFixed(2)} gegen ${viel.toFixed(2)}`);
});

test("Ein strukturloses Bild punktet schlechter als ein strukturiertes", async () => {
  const leer = document.createElement("canvas");
  leer.width = 60; leer.height = 60;
  const x = leer.getContext("2d");
  x.fillStyle = "#808080"; x.fillRect(0, 0, 60, 60);

  assert(bewerteBild(testflaeche(0.05)) > bewerteBild(leer),
    "eine gleichförmige Fläche trägt keinen Text");
});

});

test("Das ausgewertete Bild wird im Sucher gezeigt, nicht der letzte Frame", async () => {
  // zeigeStandbild übernimmt das übergebene Bild – video.pause() hätte
  // den zuletzt gesehenen Frame gezeigt, und der ist nach der Serie
  // meistens ein anderer als der gewählte.
  const b = testflaeche(0.1);
  zeigeStandbild(b);
  const sb = document.getElementById("frame-standbild");
  assert(!sb.hidden, "das ausgewertete Bild gehört sichtbar");
  assertEqual(sb.width, 60);
  verbergeAuswertung();
  assert(sb.hidden, "danach gehört der Sucher wieder frei");
});

test("Die Bewertung urteilt nach dem Verkleinern genauso", async () => {
  // Die Verkleinerung ist eine reine Tempo-Massnahme. Ändert sie die
  // Rangfolge, ist sie keine Optimierung mehr, sondern ein Fehler.
  const gross = document.createElement("canvas");
  gross.width = 1200; gross.height = 1200;
  const gx = gross.getContext("2d");
  for (let y = 0; y < 1200; y += 4) {
    gx.fillStyle = (y / 4) % 2 ? "#202020" : "#909090";
    gx.fillRect(0, y, 1200, 4);
  }
  const glanz = document.createElement("canvas");
  glanz.width = 1200; glanz.height = 1200;
  glanz.getContext("2d").drawImage(gross, 0, 0);
  const bx = glanz.getContext("2d");
  bx.fillStyle = "#ffffff"; bx.fillRect(0, 0, 1200, 700);

  assert(bewerteBild(gross) > bewerteBild(glanz),
    "das Bild mit der ausgebrannten Fläche muss auch verkleinert schlechter punkten");
});

test("Aus der Serie werden nur die besten Vollbilder aufgehoben", async () => {
  // Fünf Vollbilder gleichzeitig im Speicher sind auf einem
  // Einsteigergerät kein Nichts.

    "mehr als zwei Durchgänge durch die Texterkennung gibt es ohnehin nicht");
  assert(SERIE_BEHALTEN < SERIE_BILDER, "sonst wird nichts eingespart");
});
