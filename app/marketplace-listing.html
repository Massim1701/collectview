<!doctype html>
<html lang="de" data-theme="studio">
<head>
<title>Angebot – CollectView</title>
<meta charset="utf-8">
<script>(function(){var m=new Date().getMonth();var s=(m<2||m===11)?"winter":m<5?"fruehling":m<8?"sommer":"herbst";document.documentElement.dataset.season=s;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="192x192" href="./favicon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon-180.png">
<meta name="theme-color" content="#0E0E10">
<link rel="stylesheet" href="./vendor/fonts/fonts.css">
<link rel="stylesheet" href="../wireframes/styles.css">
<link rel="stylesheet" href="./app.css">
<style>
  /* 50% kleiner als vorher (war 100% Breite) – zwei halb so große Cover
     nebeneinander, wenn eine Rückseite vorliegt; sonst ein Cover mittig. */
  .ml-covers{ display:flex; gap:10px; max-width:50%; margin:0 0 18px; }
  .ml-covers.single{ max-width:50%; }
  .ml-cover-box{ flex:1; aspect-ratio:1; border-radius:var(--radius-md); overflow:hidden; position:relative; }
  .ml-cover-box img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ml-cover-label{ position:absolute; bottom:4px; right:6px; font-size:10px; font-weight:800;
    color:#fff; background:rgba(0,0,0,.45); padding:1px 6px; border-radius:999px; letter-spacing:.03em; text-transform:uppercase; }
  .ml-cover-box[data-full]{ cursor:zoom-in; }
  #cover-lightbox{ max-width:min(92vw, 640px); max-height:88vh; width:100%; border:0; border-radius:var(--radius-md);
    background:transparent; padding:0; }
  #cover-lightbox::backdrop{ background:rgba(0,0,0,.8); }
  #cover-lightbox img{ display:block; width:100%; max-height:88vh; object-fit:contain; border-radius:var(--radius-md); }
  #cover-lightbox-close{ position:absolute; top:10px; right:10px; width:36px; height:36px; border-radius:999px;
    background:rgba(0,0,0,.55); color:#fff; border:0; font-size:20px; line-height:1; cursor:pointer; }
  .ml-price{ font-family:var(--font-display); font-style:italic; font-size:32px; margin:4px 0 4px; }
  .ml-fx{ color:var(--text-muted); font-size:13px; font-weight:700; margin:0 0 14px; }
  .ml-date{ color:var(--text-muted); font-size:12.5px; margin-top:2px; }
  .msg{ background:var(--surface-2); border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:8px; font-size:14px; }
  .msg.own{ background:var(--accent-soft); }
  .msg-meta{ font-size:11.5px; color:var(--text-muted); margin-top:3px; }
</style>
</head>
<body>
<main class="shell">

  <a href="marketplace.html" style="display:inline-flex; align-items:center; gap:6px; color:var(--text-muted); font-weight:700; font-size:13.5px; margin:30px 0 18px;">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Marktplatz
  </a>

  <div id="content"></div>

  <dialog id="cover-lightbox">
    <button type="button" id="cover-lightbox-close" aria-label="Schließen">&times;</button>
    <img id="cover-lightbox-img" src="" alt="">
  </dialog>

</main>

<script src="./vendor/supabase.js"></script>
<script src="./config.js"></script>
<script src="./js/i18n.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/db.js"></script>
<script src="./js/currency.js"></script>
<script src="./js/marketplace.js"></script>
<script>
(async function () {
  const user = await requireAuth();
  if (!user) return;

  // Ansehen ist read-only für alle offen; nur Nachrichten schreiben braucht ein Abo.
  let subscribed = false;
  try {
    subscribed = await fetchIsSubscribed(user.id);
  } catch (e) {
    subscribed = false;
  }

  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const content = document.getElementById("content");

  if (!id) {
    content.innerHTML = errorState("Kein Angebot angegeben.");
    return;
  }

  let listing;
  try {
    listing = await fetchListing(id);
  } catch (e) {
    content.innerHTML = errorState(e.message);
    return;
  }
  if (!listing) {
    content.innerHTML = errorState("Dieses Angebot existiert nicht (mehr).");
    return;
  }

  const isOwner = listing.seller_id === user.id;
  let isMod = false;
  if (!isOwner) {
    try {
      isMod = await fetchIsModerator(user.id);
    } catch (e) {
      isMod = false;
    }
  }

  let fxRates = null;
  try {
    fxRates = await fetchFxRates();
  } catch (e) {
    // Ohne Kurse einfach keine Umrechnungszeile.
  }
  const fxLine = listingFxLine(listing, fxRates);

  const coversMarkup = (() => {
    const frontUrl = listing.cover_url || "";
    const backUrl = listing.cover_url_back || "";
    const front = frontUrl ? `<img src="${escapeHtml(frontUrl)}" alt="Vorderseite" loading="lazy">` : "";
    const back = backUrl ? `<img src="${escapeHtml(backUrl)}" alt="Rückseite" loading="lazy">` : "";
    if (!front && !back) {
      return `<div class="ml-covers single"><div class="ml-cover-box ${coverClass(listing.title)}"></div></div>`;
    }
    // data-full: welches Bild beim Anklicken groß im Lightbox-Dialog
    // erscheint (lesbar, siehe Nutzeranfrage) – nur gesetzt, wo es
    // wirklich ein Bild gibt, sonst bleibt der Platzhalter unklickbar.
    return `
      <div class="ml-covers${back ? "" : " single"}">
        <div class="ml-cover-box ${front ? "" : coverClass(listing.title)}" ${front ? `data-full="${escapeHtml(frontUrl)}"` : ""}>${front}${back ? '<span class="ml-cover-label">Vorne</span>' : ""}</div>
        ${back ? `<div class="ml-cover-box" data-full="${escapeHtml(backUrl)}">${back}<span class="ml-cover-label">Hinten</span></div>` : ""}
      </div>`;
  })();

  content.innerHTML = `
    ${coversMarkup}
    <h1 class="page-title" style="font-size:26px; margin:0;">${escapeHtml(listing.title)}</h1>
    <div style="color:var(--text-muted); margin-top:4px;">${[listing.artist, listing.format, listing.year].filter(Boolean).map(escapeHtml).join(" · ")}</div>
    <div class="ml-date">Eingestellt am ${new Date(listing.created_at).toLocaleDateString("de-DE")}</div>
    <div class="ml-price">${listingBadge(listing).text}</div>
    ${fxLine ? `<div class="ml-fx">≈ ${escapeHtml(fxLine)}</div>` : ""}
    ${listing.description ? `
      <div id="listing-desc" style="margin-bottom:22px;">
        <p style="line-height:1.6; margin:0 0 6px;">${linkifyDiscogsUrls(listing.description)}</p>
        <button type="button" class="linklike" id="translate-desc" data-i18n="marketplace_translate">Übersetzen</button>
      </div>` : ""}

    ${isOwner ? `
      <div class="card">
        <div class="section-title">Dein Angebot</div>
        <div class="row" style="display:flex; gap:10px;">
          ${listing.status === "active" ? `<button class="btn-primary" id="mark-sold" style="flex:1;height:46px;">${listing.kind === "gesucht" ? escapeHtml(t("marketplace_found")) : escapeHtml(t("marketplace_sold"))}</button>` : ""}
          ${listing.status !== "removed" ? `<button class="btn-secondary" id="remove-listing" style="flex:1;height:46px;" data-i18n="detail_remove">Entfernen</button>` : ""}
        </div>
      </div>
      <div class="card" id="messages-card">
        <div class="section-title" data-i18n="marketplace_messages">Nachrichten von Interessenten</div>
        <div id="messages"></div>
      </div>
    ` : listing.status === "active" ? (subscribed ? `
      <div class="card">
        <div class="section-title">Interesse?</div>
        <textarea class="field" id="msg-text" rows="3" placeholder="Deine Nachricht an den Verkäufer …" style="margin-bottom:10px; resize:vertical;"></textarea>
        <button class="btn-primary" id="send-msg" style="width:100%; height:46px;" data-i18n="marketplace_contact">Nachricht senden</button>
        <div class="err" id="msg-error" style="margin-top:8px;"></div>
        <div id="sent-note" class="muted" style="margin-top:10px; display:none;">Nachricht gesendet.</div>
      </div>
    ` : `
      <div class="card" style="text-align:center;">
        <p class="muted" style="margin:0 0 14px;" data-i18n="marketplace_plus_required">Nachrichten an Verkäufer:innen gibt es mit CollectView Plus.</p>
        <a class="btn-primary" href="../wireframes/pricing.html" style="display:inline-flex; align-items:center; height:44px; padding:0 20px;">Zu den Preisen</a>
      </div>
    `) : ""}

    ${isMod && listing.status !== "removed" ? `
      <div class="card" style="margin-top:14px;">
        <div class="section-title">Moderation</div>
        <button class="btn-secondary" id="mod-remove-listing" style="width:100%; height:46px;" data-i18n="detail_remove">Entfernen</button>
      </div>
    ` : ""}
  `;

  applyI18n(content);

  // Cover groß anzeigen: Klick auf Vorder-/Rückseite öffnet sie lesbar
  // im Lightbox-Dialog (Nutzeranfrage: Rückseiten-Text ist im 50%-
  // kleinen Cover sonst kaum zu lesen).
  const lightbox = document.getElementById("cover-lightbox");
  const lightboxImg = document.getElementById("cover-lightbox-img");
  content.querySelectorAll(".ml-cover-box[data-full]").forEach((box) => {
    box.addEventListener("click", () => {
      lightboxImg.src = box.dataset.full;
      lightboxImg.alt = box.querySelector("img")?.alt || "";
      lightbox.showModal();
    });
  });
  document.getElementById("cover-lightbox-close").addEventListener("click", () => lightbox.close());
  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) lightbox.close();
  });

  const descBtn = document.getElementById("translate-desc");
  if (descBtn) wireTranslateToggle(descBtn, document.getElementById("listing-desc"), () => listing.description);

  if (isOwner) {
    const soldBtn = document.getElementById("mark-sold");
    if (soldBtn) soldBtn.addEventListener("click", async () => {
      soldBtn.disabled = true;
      await setListingStatus(id, "sold");
      location.reload();
    });
    const removeBtn = document.getElementById("remove-listing");
    if (removeBtn) removeBtn.addEventListener("click", async () => {
      if (!confirm("Angebot wirklich entfernen?")) return;
      removeBtn.disabled = true;
      await setListingStatus(id, "removed");
      location.href = "marketplace.html";
    });

    const messagesEl = document.getElementById("messages");
    try {
      const messages = await fetchListingMessages(id);
      const names = await fetchDisplayNames(messages.map((m) => m.sender_id));
      messagesEl.innerHTML = messages.length
        ? messages.map((m, i) => `
            <div class="msg" id="msg-${i}">
              <div class="msg-meta" style="margin-top:0; margin-bottom:2px; font-weight:700;">${escapeHtml(names[m.sender_id] || "Unbekannter Nutzer")}</div>
              <div class="msg-body" id="msg-body-${i}">${linkifyDiscogsUrls(m.body)}</div>
              <div class="msg-meta">${new Date(m.created_at).toLocaleString("de-DE")}
                · <button type="button" class="linklike" data-translate-msg="${i}" data-i18n="marketplace_translate" style="font-size:11.5px;">Übersetzen</button>
              </div>
            </div>`).join("")
        : `<div class="muted">Noch keine Nachrichten.</div>`;

      messages.forEach((m, i) => {
        const btn = messagesEl.querySelector(`[data-translate-msg="${i}"]`);
        const body = document.getElementById(`msg-body-${i}`);
        if (btn && body) wireTranslateToggle(btn, body, () => m.body);
      });
    } catch (e) {
      messagesEl.innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`;
    }

    // Beim Ansehen als gelesen markieren – der Ungelesen-Zähler im
    // Umschlag-Symbol (renderInboxBadge) soll dann wieder stimmen.
    try {
      await markConversationRead(id, user.id);
    } catch (e) {
      /* kein Beinbruch, wenn das Markieren mal fehlschlägt */
    }
  } else if (isMod) {
    const modRemoveBtn = document.getElementById("mod-remove-listing");
    if (modRemoveBtn) modRemoveBtn.addEventListener("click", async () => {
      if (!confirm("Dieses Angebot als Moderator:in entfernen?")) return;
      modRemoveBtn.disabled = true;
      await setListingStatus(id, "removed");
      location.href = "marketplace.html";
    });
    if (listing.status === "active" && subscribed) {
      document.getElementById("send-msg").addEventListener("click", async () => {
        const text = document.getElementById("msg-text").value.trim();
        const errorEl = document.getElementById("msg-error");
        errorEl.textContent = "";
        if (!text) { errorEl.textContent = "Bitte eine Nachricht eingeben."; return; }
        // Benutzername ist Pflicht, bevor eine Nachricht rausgeht -- siehe
        // requireDisplayName() in auth.js.
        if (!(await requireDisplayName(user))) return;
        try {
          await sendListingMessage(id, listing.seller_id, text);
          document.getElementById("msg-text").value = "";
          document.getElementById("sent-note").style.display = "block";
        } catch (e) {
          errorEl.textContent = e.message;
        }
      });
    }
  } else if (listing.status === "active" && subscribed) {
    document.getElementById("send-msg").addEventListener("click", async () => {
      const text = document.getElementById("msg-text").value.trim();
      const errorEl = document.getElementById("msg-error");
      errorEl.textContent = "";
      if (!text) { errorEl.textContent = "Bitte eine Nachricht eingeben."; return; }
      if (!(await requireDisplayName(user))) return;
      try {
        await sendListingMessage(id, listing.seller_id, text);
        document.getElementById("msg-text").value = "";
        document.getElementById("sent-note").style.display = "block";
      } catch (e) {
        errorEl.textContent = e.message;
      }
    });
  }
})();
</script>
</body>
</html>
