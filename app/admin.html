<!doctype html>
<html lang="de" data-theme="studio">
<head>
<title>Admin – CollectView</title>
<meta charset="utf-8">
<script>(function(){var m=new Date().getMonth();var s=(m<2||m===11)?"winter":m<5?"fruehling":m<8?"sommer":"herbst";document.documentElement.dataset.season=s;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="192x192" href="./favicon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon-180.png">
<meta name="theme-color" content="#0E0E10">
<link rel="stylesheet" href="./vendor/fonts/fonts.css">
<link rel="stylesheet" href="../wireframes/styles.css">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<main class="shell">

  <a href="index.html" style="display:inline-flex; align-items:center; gap:6px; color:var(--text-muted); font-weight:700; font-size:13.5px; margin:30px 0 18px;">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Zur Startseite
  </a>

  <div id="content"></div>

</main>

<script src="./vendor/supabase.js"></script>
<script src="./config.js"></script>
<script src="./js/i18n.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/db.js"></script>
<script src="./js/admin.js"></script>
<script>
(async function () {
  const user = await requireAuth();
  if (!user) return;

  const content = document.getElementById("content");

  let isAdmin = false;
  try {
    isAdmin = await fetchIsAdmin(user.id);
  } catch (e) {
    content.innerHTML = errorState(e.message);
    return;
  }

  if (!isAdmin) {
    content.innerHTML = errorState("Diese Seite ist nur für Admins.");
    return;
  }

  content.innerHTML = `
    <h1 class="page-title" style="font-size:26px; margin:10px 0 6px;">Admin</h1>
    <p class="muted" style="margin:0 0 22px;">Rollen vergeben – maximal 2 Admins, maximal 3 Moderatoren (von der Datenbank erzwungen).</p>

    <div class="card" style="margin-bottom:18px;">
      <div class="section-title">Rolle vergeben</div>
      <form id="admin-form">
        <input class="field" id="admin-username" type="text" placeholder="Benutzername" style="margin-bottom:10px;" required>
        <select class="field" id="admin-role" style="margin-bottom:10px;">
          <option value="moderator">Moderator</option>
          <option value="admin">Admin</option>
        </select>
        <button class="btn-primary" type="submit" style="width:100%; height:46px;">Rolle setzen</button>
        <div id="admin-result" class="muted" style="margin-top:10px;"></div>
      </form>
    </div>

    <div class="card">
      <div class="section-title">Aktuelle Moderatoren &amp; Admins</div>
      <div id="staff-list"></div>
    </div>
  `;

  const staffList = document.getElementById("staff-list");
  wireAdminForm(document.getElementById("admin-form"), document.getElementById("admin-result"), staffList);
  renderStaffList(staffList);
})();
</script>
</body>
</html>
