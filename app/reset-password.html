<!doctype html>
<html lang="de" data-theme="studio">
<head>
<title>Neues Passwort – CollectView</title>
<meta charset="utf-8">
<script>(function(){var m=new Date().getMonth();var s=(m<2||m===11)?"winter":m<5?"fruehling":m<8?"sommer":"herbst";document.documentElement.dataset.season=s;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="192x192" href="./favicon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon-180.png">
<meta name="theme-color" content="#0E0E10">
<link rel="stylesheet" href="./vendor/fonts/fonts.css">
<link rel="stylesheet" href="../wireframes/styles.css">
<link rel="stylesheet" href="./app.css">
<style>
  .login-shell{ max-width:440px; padding-top:70px; padding-bottom:60px; }
  .login-intro{ text-align:center; margin-bottom:34px; }
  .login-intro .brand{ font-size:30px; }
  .login-intro p{ color:var(--text-muted); font-size:14.5px; line-height:1.6; margin:10px 0 0; }
</style>
</head>
<body>

<main class="shell login-shell">

  <div class="login-intro">
    <div class="brand">CollectView</div>
    <p>Neues Passwort für dein Konto vergeben.</p>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="icon-badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      </div>
      <div>
        <div class="card-head-title">Neues Passwort</div>
        <div class="card-head-sub">Gilt sofort für die App und den Browser</div>
      </div>
    </div>

    <form id="reset-form" novalidate>
      <label class="sr-only" for="password">Neues Passwort</label>
      <input class="field" id="password" name="password" type="password" autocomplete="new-password" required minlength="6" placeholder="Neues Passwort (min. 6 Zeichen)">

      <label class="sr-only" for="password2">Neues Passwort wiederholen</label>
      <input class="field" id="password2" name="password2" type="password" autocomplete="new-password" required minlength="6" placeholder="Passwort wiederholen">

      <div class="row">
        <button class="btn-primary" type="submit">Passwort speichern</button>
      </div>
    </form>

    <p class="err" id="reset-error" role="alert" aria-live="assertive"></p>
    <p class="note" id="reset-note" role="status" aria-live="polite"></p>
  </div>

</main>

<script src="./vendor/supabase.js"></script>
<script src="./config.js"></script>
<script src="./js/reset-password.js"></script>
</body>
</html>
