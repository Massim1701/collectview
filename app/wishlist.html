<!doctype html>
<html lang="de">
<head>
<title>Wunschliste – CollectView</title>
<meta charset="utf-8">
<script>(function(){var m=new Date().getMonth();var s=(m<2||m===11)?"winter":m<5?"fruehling":m<8?"sommer":"herbst";document.documentElement.dataset.season=s;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="stylesheet" href="./vendor/fonts/fonts.css">
<link rel="stylesheet" href="../wireframes/styles.css">
<link rel="stylesheet" href="./app.css">
<style>
  .wl-head{ display:flex; align-items:center; justify-content:space-between; gap:14px; margin:38px 0 16px; }
  .wl-head .page-title{ margin:0; font-size:28px; }
  #wl-list .list-card + .list-card, #notif-list .list-card + .list-card, #notif-list a.list-card + a.list-card{ margin-top:10px; }
  .wl-add-toggle{ width:100%; height:48px; margin-bottom:22px; }
  #add-form{ display:none; margin-bottom:26px; }
  #add-form.open{ display:block; }
  .ln-row{ display:flex; gap:10px; }
  .ln-row .field{ flex:1; }
</style>
</head>
<body>
<a class="skip-link" href="#wl-list">Direkt zur Wunschliste</a>

<main class="shell">

  <a href="index.html" style="display:inline-flex; align-items:center; gap:6px; color:var(--text-muted); font-weight:700; font-size:13.5px; margin:30px 0 18px;">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    <span data-i18n="nav_home">Home</span>
  </a>

  <h1 class="page-title" style="font-size:28px; margin:0 0 20px;" data-i18n="wishlist_title">Wunschliste</h1>

  <section aria-labelledby="titel-benachrichtigungen" style="margin-bottom:30px;">
    <h2 class="section-title" id="titel-benachrichtigungen">Benachrichtigungen</h2>
    <div id="notif-list"></div>
  </section>

  <div class="wl-head" style="margin-top:0;">
    <h2 class="section-title" style="margin:0;">Meine Wunschliste</h2>
  </div>

  <form id="wl-search-form" class="card" style="margin-bottom:14px;">
    <div class="ln-row" style="margin-bottom:10px;">
      <input class="field" id="wl-search-artist" placeholder="Interpret" autocomplete="off">
      <input class="field" id="wl-search-title" placeholder="Titel" autocomplete="off">
    </div>
    <button class="btn-primary" type="submit" style="width:100%; height:44px;">Bei Discogs suchen</button>
    <div class="note" style="margin-top:8px;">Eins von beiden reicht auch – je mehr ausgefüllt ist, desto genauer der Treffer.</div>
    <div class="err" id="wl-search-error" style="margin-top:10px;"></div>
  </form>
  <div id="wl-search-results" style="margin-bottom:22px;"></div>

  <button class="btn-secondary wl-add-toggle" type="button" id="add-toggle">+ Tonträger von Hand eintragen</button>

  <form id="add-form" class="card">
    <input class="field" id="wl-title" placeholder="Titel *" required style="margin-bottom:10px;">
    <div class="ln-row" style="margin-bottom:10px;">
      <input class="field" id="wl-artist" placeholder="Interpret">
      <input class="field" id="wl-format" placeholder="Format (z. B. Vinyl, LP)">
    </div>
    <input class="field" id="wl-year" type="number" placeholder="Jahr" min="1900" max="2100" style="margin-bottom:14px;">
    <button class="btn-primary" type="submit" style="width:100%; height:48px;" id="wl-submit">Zur Wunschliste hinzufügen</button>
    <div class="err" id="wl-error" style="margin-top:10px;"></div>
  </form>

  <div id="wl-list"></div>

</main>

<div class="bottomnav" id="bottomnav"></div>

<script src="./vendor/supabase.js"></script>
<script src="./config.js"></script>
<script src="./js/discogs.js"></script>
<script src="./js/i18n.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/db.js"></script>
<script src="./js/wishlist.js"></script>
<script>
(async function () {
  const user = await requireAuth();
  if (!user) return;
  renderBottomNav(document.getElementById("bottomnav"), null);

  const notifList = document.getElementById("notif-list");
  const wlList = document.getElementById("wl-list");
  const addToggle = document.getElementById("add-toggle");
  const addForm = document.getElementById("add-form");
  const searchForm = document.getElementById("wl-search-form");
  const searchArtistInput = document.getElementById("wl-search-artist");
  const searchTitleInput = document.getElementById("wl-search-title");
  const searchError = document.getElementById("wl-search-error");
  const searchResultsEl = document.getElementById("wl-search-results");
  let lastSearchResults = [];

  async function renderNotifications() {
    try {
      const notifs = await fetchNotifications(user.id);
      notifList.innerHTML = notifs.length
        ? notifs.slice(0, 20).map((n) => notificationCardMarkup(n)).join("")
        : `<div class="muted">Noch keine Treffer – wir melden uns, sobald etwas von deiner Wunschliste im Marktplatz auftaucht.</div>`;
    } catch (e) {
      notifList.innerHTML = errorState(e.message);
    }
  }

  async function renderWishlist() {
    wlList.innerHTML = skeletonGrid(2);
    try {
      const items = await fetchWishlist(user.id);
      wlList.innerHTML = items.length
        ? items.map((it) => wishlistCardMarkup(it)).join("")
        : emptyState({ iconName: "grid", title: "Noch nichts gemerkt", text: "Füge Tonträger hinzu, die du suchst – wir behalten den Marktplatz für dich im Auge." });
    } catch (e) {
      wlList.innerHTML = errorState(e.message);
    }
  }

  searchForm.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const artist = searchArtistInput.value.trim();
    const title = searchTitleInput.value.trim();
    const text = [artist, title].filter(Boolean).join(" ");
    searchError.textContent = "";
    if (!text) { searchError.textContent = "Bitte Interpret und/oder Titel eingeben."; return; }
    searchResultsEl.innerHTML = skeletonGrid(2);
    try {
      lastSearchResults = await searchDiscogsForWishlist(text);
      let hinweis = "";
      // Interpret + Titel zusammen treffen Discogs' Schreibweise nicht immer
      // exakt (Zusatz im Titel, andere Reihenfolge, Sonderzeichen). Bevor
      // wir "keine Treffer" melden, erst mit nur dem Interpret nachfragen –
      // genau der Fall, den ein Nutzer gemeldet hat: kombiniert 0 Treffer,
      // nur Interpret 8 Treffer.
      if (!lastSearchResults.length && artist && title) {
        lastSearchResults = await searchDiscogsForWishlist(artist);
        if (lastSearchResults.length) {
          hinweis = `<div class="note" style="margin-bottom:10px;">Kein Treffer für „${escapeHtml(artist)} ${escapeHtml(title)}“ – hier alle Treffer nur für „${escapeHtml(artist)}“:</div>`;
        }
      }
      searchResultsEl.innerHTML = lastSearchResults.length
        ? hinweis + lastSearchResults.map((item, i) => wishlistSearchResultMarkup(item, i)).join("")
        : `<div class="muted">Keine Treffer bei Discogs.</div>`;
    } catch (e) {
      searchResultsEl.innerHTML = "";
      searchError.textContent = e.message;
    }
  });

  searchResultsEl.addEventListener("click", async (ev) => {
    const btn = ev.target.closest(".wishlist-search-add");
    if (!btn) return;
    const item = lastSearchResults[parseInt(btn.dataset.index, 10)];
    if (!item) return;
    btn.disabled = true;
    btn.textContent = "Wird hinzugefügt …";
    try {
      await addWishlistItem({
        user_id: user.id,
        discogs_id: item.discogs_id,
        title: item.title,
        artist: item.artist,
        format: item.format,
        year: item.year,
        cover_url: item.cover_url,
        barcode: item.barcode,
      });
      searchResultsEl.innerHTML = "";
      searchArtistInput.value = "";
      searchTitleInput.value = "";
      renderWishlist();
    } catch (e) {
      btn.disabled = false;
      btn.textContent = "Hinzufügen";
      searchError.textContent = e.message;
    }
  });

  addToggle.addEventListener("click", () => {
    addForm.classList.toggle("open");
    addToggle.style.display = addForm.classList.contains("open") ? "none" : "block";
  });

  notifList.addEventListener("click", async (ev) => {
    const card = ev.target.closest("[data-notif-id]");
    if (!card) return;
    try {
      await markNotificationRead(card.dataset.notifId);
    } catch (e) {
      // Lesestatus konnte nicht gespeichert werden – Navigation trotzdem zulassen.
    }
  });

  wlList.addEventListener("click", async (ev) => {
    const btn = ev.target.closest(".wishlist-remove");
    if (!btn) return;
    btn.disabled = true;
    try {
      await removeWishlistItem(btn.dataset.id);
      renderWishlist();
    } catch (e) {
      btn.disabled = false;
    }
  });

  addForm.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const errorEl = document.getElementById("wl-error");
    const submitBtn = document.getElementById("wl-submit");
    errorEl.textContent = "";
    const title = document.getElementById("wl-title").value.trim();
    if (!title) { errorEl.textContent = "Bitte einen Titel eingeben."; return; }
    submitBtn.disabled = true;
    submitBtn.textContent = "Wird hinzugefügt …";
    try {
      await addWishlistItem({
        user_id: user.id,
        title,
        artist: document.getElementById("wl-artist").value.trim() || null,
        format: document.getElementById("wl-format").value.trim() || null,
        year: document.getElementById("wl-year").value ? parseInt(document.getElementById("wl-year").value, 10) : null,
      });
      addForm.reset();
      addForm.classList.remove("open");
      addToggle.style.display = "block";
      renderWishlist();
    } catch (e) {
      errorEl.textContent = e.message;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Zur Wunschliste hinzufügen";
    }
  });

  renderNotifications();
  renderWishlist();
})();
</script>
</body>
</html>
