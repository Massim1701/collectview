<!doctype html>
<html lang="de">
<head>
<title>Marktplatz – CollectView</title>
<meta charset="utf-8">
<script>(function(){var m=new Date().getMonth();var s=(m<2||m===11)?"winter":m<5?"fruehling":m<8?"sommer":"herbst";document.documentElement.dataset.season=s;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="stylesheet" href="./vendor/fonts/fonts.css">
<link rel="stylesheet" href="../wireframes/styles.css">
<link rel="stylesheet" href="./app.css">
<style>
  .mp-head{ display:flex; align-items:center; justify-content:space-between; gap:14px; margin:38px 0 16px; }
  .mp-head .page-title{ margin:0; font-size:28px; }
  #list .list-card + .list-card{ margin-top:10px; }
</style>
</head>
<body>
<a class="skip-link" href="#list">Direkt zu den Angeboten</a>

<main class="shell">

  <div class="mp-head">
    <h1 class="page-title">Marktplatz</h1>
    <a class="btn-primary" id="new-btn" style="height:42px; padding:0 18px; display:inline-flex; align-items:center;" href="listing-new.html">Neuer Beitrag</a>
  </div>

  <div id="paywall" hidden class="card" style="text-align:center; padding:34px 24px;">
    <div class="section-title" style="justify-content:center;">Nur für CollectView Plus</div>
    <p class="muted" style="margin:8px 0 20px;">Der Marktplatz ist Abo-Mitgliedern vorbehalten – biete oder suche Tonträger,
      Kontakt läuft ausschließlich per Direktnachricht.</p>
    <a class="btn-primary" href="../wireframes/pricing.html" style="display:inline-flex; align-items:center; height:46px; padding:0 22px;">Zu den Preisen</a>
  </div>

  <div id="browse">
    <div class="chip-row" id="tabs" role="tablist" aria-label="Marktplatz-Ansicht" style="margin-bottom:18px;">
      <button class="chip active" type="button" data-tab="all" role="tab" aria-selected="true">Alle Beiträge</button>
      <button class="chip" type="button" data-tab="mine" role="tab" aria-selected="false">Meine Beiträge</button>
    </div>

    <div id="list"></div>
  </div>

</main>

<div class="bottomnav" id="bottomnav"></div>

<script>var config={};</script>
<script src="./stub2.js"></script>
<script src="./js/i18n.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/marketplace.js"></script>
<script>
(async function () {
  const user = await requireAuth();
  if (!user) return;
  renderBottomNav(document.getElementById("bottomnav"), null);

  let subscribed = false;
  try {
    subscribed = await fetchIsSubscribed(user.id);
  } catch (e) {
    // Bei Fehler vorsichtshalber sperren statt versehentlich zu öffnen.
  }
  if (!subscribed) {
    document.getElementById("paywall").hidden = false;
    document.getElementById("browse").hidden = true;
    document.getElementById("new-btn").hidden = true;
    return;
  }

  const list = document.getElementById("list");
  const tabs = document.getElementById("tabs");
  let active = "all";

  async function render() {
    list.innerHTML = skeletonGrid(3);
    try {
      const items = active === "all" ? await fetchActiveListings() : await fetchMyListings(user.id);
      if (items.length === 0) {
        list.innerHTML = emptyState(
          active === "all"
            ? { iconName: "grid", title: "Noch keine Angebote", text: "Sei die erste Person, die hier etwas anbietet." }
            : { iconName: "grid", title: "Noch nichts eingestellt", text: "Verkaufe Tonträger aus deiner Sammlung.", action: { href: "listing-new.html", label: "Angebot erstellen" } },
        );
        return;
      }
      list.innerHTML = items.map((it) => listingCardMarkup(it)).join("");
    } catch (e) {
      list.innerHTML = errorState(e.message);
    }
  }

  tabs.addEventListener("click", (ev) => {
    const btn = ev.target.closest("button[data-tab]");
    if (!btn) return;
    active = btn.dataset.tab;
    tabs.querySelectorAll("button").forEach((b) => {
      b.classList.toggle("active", b === btn);
      b.setAttribute("aria-selected", String(b === btn));
    });
    render();
  });

  render();
})();
</script>
</body>
</html>
