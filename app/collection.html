<!doctype html>
<html lang="de">
<head>
<title>Meine Sammlung – Plattenregal</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="stylesheet" href="./vendor/fonts/fonts.css">
<link rel="stylesheet" href="../wireframes/styles.css">
<link rel="stylesheet" href="./app.css">
<style>
  .collection-head{ position:sticky; top:0; z-index:30; background:var(--bg); margin:0 -22px; padding:10px 22px 0; }
  /* Weicher Auslauf, damit Kacheln nicht hart unter dem Header abreißen */
  .collection-head::after{ content:""; display:block; height:24px; margin:0 -22px -24px; background:linear-gradient(var(--bg) 40%, transparent); pointer-events:none; }
  .shell{ padding-top:0; }
  #grid{ scroll-margin-top:190px; display:flex; flex-direction:column; gap:var(--space-2); }
  .alpha-heading{
    font-family:var(--font-display); font-style:italic; font-size:var(--text-xl);
    color:var(--text-muted); margin:var(--space-4) var(--space-1) 0;
  }
  .alpha-heading:first-child{ margin-top:0; }
  .list-card-plain{ padding:var(--space-3) var(--space-4); }
</style>
</head>
<body>
<a class="skip-link" href="#grid">Direkt zur Sammlung</a>

<main class="shell">

  <h1 class="page-title" style="font-size:28px; margin:38px 0 16px;" data-i18n="collection_title">Meine Sammlung</h1>

  <div class="collection-head">
    <div class="search-bar">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <label class="sr-only" for="suche">Sammlung durchsuchen</label>
      <input id="suche" type="search" autocomplete="off" placeholder="Interpret, Titel, Format …">
      <button class="search-clear" type="button" id="search-clear" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        <span class="sr-only">Suche zurücksetzen</span>
      </button>
    </div>

    <div class="chip-row" id="chips" role="group" aria-label="Nach Format filtern"></div>

    <div class="toolbar">
      <span class="result-count" id="result-count" role="status" aria-live="polite"></span>
      <label class="sr-only" for="sortierung">Sortierung</label>
      <select class="sort-select" id="sortierung"></select>
    </div>
  </div>

  <div class="cover-grid" id="grid"></div>
  <div id="grid-message"></div>

</main>

<div class="bottomnav" id="bottomnav"></div>

<script src="./vendor/supabase.js"></script>
<script src="./config.js"></script>
<script src="./js/i18n.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/offline-cache.js"></script>
<script src="./js/db.js"></script>
<script src="./js/collection.js"></script>
</body>
</html>
