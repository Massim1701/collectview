<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>(function(){var m=new Date().getMonth();var s=(m<2||m===11)?"winter":m<5?"fruehling":m<8?"sommer":"herbst";document.documentElement.dataset.season=s;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Scanner – Plattenregal</title>
<link rel="stylesheet" href="./vendor/fonts/fonts.css">
<link rel="stylesheet" href="../wireframes/styles.css">
<link rel="stylesheet" href="./app.css">
<style>
  /* Nur Scanner-spezifisch – alles Übrige kommt aus styles.css + app.css */
  .segmented{ margin-bottom:18px; display:flex; }
  .segmented-item.disabled{ opacity:.45; pointer-events:none; }

  /* Der Kamerarahmen bleibt bewusst dunkel: er zeigt ein Videobild,
     kein Dokument – dunkel drumherum lenkt weniger vom Sucher ab. */
  .scan-frame{
    position:relative; border-radius:var(--radius-sm); overflow:hidden;
    background:radial-gradient(circle at 50% 40%, #2A2A2E, #121214 75%);
    min-height:80px; display:flex; align-items:center; justify-content:center;
  }
  /* Das Sucherfenster ist bewusst niedrig. Ein Barcode ist breit und
     flach; ein hohes Videobild zeigt vor allem Tisch und Daumen und
     schiebt dabei Statuszeile und Treffer aus dem Bild. object-fit
     schneidet mittig zu, statt das Bild zu stauchen – der Ausschnitt
     bleibt also formattreu. */
  #video{ width:100%; height:180px; object-fit:cover; display:none; background:#000; }
  .scan-frame.live #video{ display:block; }
  /* Ein Cover ist quadratisch: dafür braucht es mehr Höhe als für einen
     Strichcode, sonst sieht man die Hülle nie ganz. */
  .scan-frame.cover-mode #video{ height:300px; }
  .scan-frame.live .placeholder{ display:none; }
  .placeholder{ padding:46px 20px; text-align:center; color:#B9B2A4; font-size:14.5px; display:flex; flex-direction:column; align-items:center; gap:10px; }

  .status{ font-size:14.5px; color:var(--text-muted); margin-top:14px; min-height:18px; line-height:1.5; }
  .status.active{ color:var(--accent-text); font-weight:700; }

  .count-badge{ color:var(--text-muted); font-weight:600; font-size:13.5px; }

  /* Kameraauswahl – nur sichtbar, wenn mehr als eine Kamera gefunden wurde
     (typisch am Rechner: eingebaute Webcam + externe Webcam). */
  #camera-select{ margin-top:10px; width:100%; }
  #camera-select[hidden]{ display:none; }

  #capture-btn[hidden]{ display:none; }
</style>
</head>
<body>
<a class="skip-link" href="#scan-card">Zum Scanner springen</a>

<main class="shell">

  <div class="page-header">
    <div class="brand">Plattenregal</div>
    <div class="tag">Scanner</div>
  </div>

  <div class="card" id="scan-card">
    <div class="card-head">
      <div class="icon-badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="8" width="10" height="8" rx="1"/><path d="M4 8V6a2 2 0 0 1 2-2h2M20 8V6a2 2 0 0 0-2-2h-2M4 16v2a2 2 0 0 0 2 2h2M20 16v2a2 2 0 0 1-2 2h-2"/></svg>
      </div>
      <div>
        <div class="card-head-title">Scannen</div>
        <div class="card-head-sub">Barcode der Schallplatte oder CD erfassen</div>
      </div>
    </div>

    <div class="segmented" id="mode-toggle">
      <div class="segmented-item active" data-mode="barcode">Barcode</div>
      <div class="segmented-item" data-mode="cover">Cover-Foto</div>
    </div>

    <div class="scan-frame" id="scan-frame">
      <video id="video" autoplay muted playsinline></video>
      <div class="placeholder">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="8" width="10" height="8" rx="1"/><path d="M4 8V6a2 2 0 0 1 2-2h2M20 8V6a2 2 0 0 0-2-2h-2M4 16v2a2 2 0 0 0 2 2h2M20 16v2a2 2 0 0 1-2 2h-2"/></svg>
        Kamera noch nicht aktiv
      </div>
    </div>

    <select class="field" id="camera-select" hidden aria-label="Kamera wählen"></select>

    <div class="row">
      <button class="btn-primary" style="height:52px;" id="scan-btn" type="button">Barcode-Scan starten</button>
      <button class="btn-secondary" style="height:52px;" id="capture-btn" type="button" hidden>Foto aufnehmen</button>
      <!-- Erscheint nur, wenn das Gerät ein schaltbares Licht meldet.
           Siehe den Abschnitt "Licht" in js/scanner.js: ohne diese
           Bedingung liefe ein applyConstraints auf den laufenden
           Kamerastrom, und das hat auf iOS schon die Kamera beendet. -->
      <button class="btn-secondary" style="height:52px;" id="torch-btn" type="button" hidden aria-pressed="false">Licht an</button>
    </div>
    <div class="notice" id="scan-notice" role="status" aria-live="polite" hidden></div>
    <p class="status" id="scan-status" role="status" aria-live="polite"></p>
    <p class="scan-quota" id="scan-quota" role="status" aria-live="polite"></p>

    <!-- Barcode von Hand. Nicht nur zum Prüfen, ob die Kamera oder die
         Suche klemmt: Aufkleber, Kratzer und Preisschilder machen genug
         Codes unlesbar, und die Ziffern stehen daneben. -->
    <form class="code-form" id="code-form">
      <label class="sr-only" for="code-input">Barcode-Ziffern</label>
      <input class="field" id="code-input" type="text"
             autocomplete="off" spellcheck="false" maxlength="80"
             placeholder="Barcode oder Interpret und Titel">
      <button class="btn-secondary" type="submit" id="code-submit">Suchen</button>
      <p class="err" id="code-error" role="alert"></p>
    </form>

    <!-- Prüft die Kette hinter dem Scan Glied für Glied. "Geht nicht"
         hat zu viele mögliche Ursachen, um es zu raten. -->
    <p class="manual-hint" style="text-align:left;">
      <button type="button" class="linklike" id="selftest-btn">Selbsttest</button>
    </p>
    <div id="selftest-out"></div>
  </div>

  <div class="card" id="results-card" style="display:none;">
    <div class="card-head">
      <div class="icon-badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </div>
      <div>
        <div class="card-head-title" id="results-title">Treffer</div>
        <div class="card-head-sub" id="results-sub">Zum Speichern antippen</div>
      </div>
    </div>
    <div id="results"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="icon-badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </div>
      <div style="flex:1;display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <div>
          <div class="card-head-title">Zuletzt gespeichert</div>
          <div class="card-head-sub"><a href="collection.html" style="color:var(--accent-text);font-weight:700;">Ganze Sammlung ansehen</a></div>
        </div>
        <span class="count-badge" id="recent-count"></span>
      </div>
    </div>
    <div id="recent-saved"></div>
  </div>

  <div class="card" id="account-card"></div>

</main>

<div class="bottomnav" id="bottomnav"></div>

<script src="./vendor/supabase.js"></script>
<script src="./vendor/zxing-browser.min.js"></script>
<!-- Nur für den Cover-Foto-Modus geladen (siehe scanner.js): Texterkennung
     läuft komplett im Browser, kein externer API-Key nötig. -->
<script src="./vendor/tesseract.min.js"></script>
<script src="./config.js"></script>
<script src="./js/i18n.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/db.js"></script>
<!-- wishlist.js nur wegen addWishlistItem/removeWishlistItem – die Datei
     selbst bleibt unverändert. -->
<script src="./js/wishlist.js"></script>
<script src="./js/discogs.js"></script>
<script src="./js/cover-erkennen.js"></script>
<script src="./js/releases.js"></script>
<script src="./js/scan-status.js"></script>
<script src="./js/scan-limit.js"></script>
<script src="./js/selftest.js"></script>
<script src="./js/scanner.js"></script>
</body>
</html>
