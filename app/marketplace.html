<!doctype html>
<html lang="de" data-theme="studio">
<head>
<title>Marktplatz – CollectView</title>
<meta charset="utf-8">
<script>(function(){var m=new Date().getMonth();var s=(m<2||m===11)?"winter":m<5?"fruehling":m<8?"sommer":"herbst";document.documentElement.dataset.season=s;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="192x192" href="./favicon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon-180.png">
<meta name="theme-color" content="#0E0E10">
<link rel="stylesheet" href="./vendor/fonts/fonts.css">
<link rel="stylesheet" href="../wireframes/styles.css">
<link rel="stylesheet" href="./app.css">
<style>
  .mp-head{ display:flex; align-items:center; justify-content:space-between; gap:14px; margin:38px 0 16px; }
  .mp-head .page-title{ margin:0; font-size:28px; }
  #list .list-card + .list-card{ margin-top:10px; }
</style>
</head>
<body>
<a class="skip-link" href="#list">Direkt zu den Angeboten</a>

<main class="shell">

  <div class="mp-head">
    <h1 class="page-title" data-i18n="marketplace_title">Forum</h1>
    <a class="btn-primary" id="new-btn" style="height:42px; padding:0 18px; display:inline-flex; align-items:center;" href="listing-new.html" data-i18n="marketplace_new_post">Neuer Beitrag</a>
  </div>

  <div id="paywall" hidden class="card" style="text-align:center; padding:20px 24px; margin-bottom:18px;">
    <p class="muted" style="margin:0;">Du siehst den Marktplatz nur lesend. Eigene Beiträge und Nachrichten
      an Verkäufer:innen gibt es mit <a href="../wireframes/pricing.html" style="color:var(--accent-text); font-weight:700;">CollectView Plus</a>.</p>
  </div>

  <div id="browse">
    <div class="chip-row" id="tabs" role="tablist" aria-label="Marktplatz-Ansicht" style="margin-bottom:18px;">
      <button class="chip active" type="button" data-tab="all" role="tab" aria-selected="true" data-i18n="marketplace_tab_all">Alle Beiträge</button>
      <button class="chip" type="button" data-tab="mine" role="tab" aria-selected="false" data-i18n="marketplace_tab_mine">Meine Beiträge</button>
    </div>

    <div id="list"></div>
  </div>

</main>

<div class="bottomnav" id="bottomnav"></div>

<script src="./vendor/supabase.js"></script>
<script src="./config.js"></script>
<script src="./js/i18n.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/db.js"></script>
<script src="./js/marketplace.js"></script>
<script>
(async function () {
  const user = await requireAuth();
  if (!user) return;
  renderBottomNav(document.getElementById("bottomnav"), null);

  // Ansehen ist für alle offen (read-only); nur Erstellen braucht ein Abo.
  let subscribed = false;
  try {
    subscribed = await fetchIsSubscribed(user.id);
  } catch (e) {
    // Ohne Antwort vorsichtshalber als nicht abonniert behandeln.
  }
  document.getElementById("paywall").hidden = subscribed;
  document.getElementById("new-btn").hidden = !subscribed;

  const list = document.getElementById("list");
  const tabs = document.getElementById("tabs");
  let active = "all";

  async function render() {
    list.innerHTML = skeletonGrid(3);
    try {
      const items = active === "all" ? await fetchActiveListings() : await fetchMyListings(user.id);
      if (items.length === 0) {
        list.innerHTML = emptyState(
          active === "all"
            ? { iconName: "grid", title: "Noch keine Angebote", text: "Sei die erste Person, die hier etwas anbietet." }
            : { iconName: "grid", title: "Noch nichts eingestellt", text: "Verkaufe Tonträger aus deiner Sammlung.", action: { href: "listing-new.html", label: "Angebot erstellen" } },
        );
        return;
      }
      list.innerHTML = items.map((it) => listingCardMarkup(it)).join("");
    } catch (e) {
      list.innerHTML = errorState(e.message);
    }
  }

  tabs.addEventListener("click", (ev) => {
    const btn = ev.target.closest("button[data-tab]");
    if (!btn) return;
    active = btn.dataset.tab;
    tabs.querySelectorAll("button").forEach((b) => {
      b.classList.toggle("active", b === btn);
      b.setAttribute("aria-selected", String(b === btn));
    });
    render();
  });

  render();
})();
</script>
</body>
</html>
